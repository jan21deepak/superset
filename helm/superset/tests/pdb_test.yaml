suite: pod disruption budget
templates:
  - pdb.yaml
  - pdb-worker.yaml
  - pdb-beat.yaml
  - pdb-flower.yaml
  - pdb-ws.yaml
  - pdb-mcp.yaml
tests:
  - it: renders supersetNode pdb with enabled true alone
    template: pdb.yaml
    set:
      supersetNode.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.minAvailable
          value: 1
      - isNull:
          path: spec.maxUnavailable

  - it: renders supersetWorker pdb with enabled true alone
    template: pdb-worker.yaml
    set:
      supersetWorker.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.minAvailable
          value: 1

  - it: fails when both minAvailable and maxUnavailable are set
    template: pdb.yaml
    set:
      supersetNode.podDisruptionBudget.enabled: true
      supersetNode.podDisruptionBudget.minAvailable: 1
      supersetNode.podDisruptionBudget.maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: Only one of minAvailable or maxUnavailable should be set
